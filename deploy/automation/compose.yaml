name: shotlin-automation
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperclip
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${PAPERCLIP_DB_PASSWORD:?Set the database password in the private environment file}
    volumes:
      - paperclip-postgres:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paperclip -d paperclip']
      interval: 10s
      timeout: 5s
      retries: 12
  paperclip:
    image: ghcr.io/paperclipai/paperclip:2026.1023.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:3200:3100'
    environment:
      HOST: '0.0.0.0'
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: public
      PAPERCLIP_AUTH_BASE_URL_MODE: explicit
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: https://automation.shotlin.in
      PAPERCLIP_PUBLIC_URL: https://automation.shotlin.in
      PAPERCLIP_ALLOWED_HOSTNAMES: automation.shotlin.in,localhost,127.0.0.1
      DATABASE_URL: postgres://paperclip:${PAPERCLIP_DB_PASSWORD}@db:5432/paperclip
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set the authentication secret in the private environment file}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - paperclip-data:/paperclip
    pids_limit: 512
    mem_limit: 3g
    cpus: 1.5
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
volumes:
  paperclip-data:
  paperclip-postgres:
