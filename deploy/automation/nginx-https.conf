server {
    listen 80;
    server_name automation.shotlin.in;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }
    location / { return 301 https://automation.shotlin.in$request_uri; }
}

server {
    listen 443 ssl;
    server_name automation.shotlin.in;
    ssl_certificate /etc/letsencrypt/live/automation.shotlin.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/automation.shotlin.in/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
